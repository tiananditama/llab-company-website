<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:16px;">Three radii. Almost everything is sharp.</div>
  <div style="display:flex; gap:24px; align-items:flex-end;">
    <div style="text-align:center;">
      <div style="width:120px; height:120px; background:#1A1B16; border:1px solid rgba(255,255,255,0.12); border-radius:0;"></div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em; color:#F4F4EF; margin-top:10px;">0PX · DEFAULT</div>
    </div>
    <div style="text-align:center;">
      <div style="width:120px; height:120px; background:#1A1B16; border:1px solid rgba(255,255,255,0.12); border-radius:5px;"></div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em; color:#F4F4EF; margin-top:10px;">5PX · CARDS</div>
    </div>
    <div style="text-align:center;">
      <div style="width:220px; height:52px; background:#AEFE00; border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:var(--font-ui); font-weight:700; font-size:18px; color:#0A0B08;">Pill · 999px</div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em; color:#F4F4EF; margin-top:10px;">999PX · BUTTONS</div>
    </div>
  </div>
</div>
</body></html>

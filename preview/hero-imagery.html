<!doctype html>
<html><head><meta charset="utf-8"><title>Hero imagery</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card" style="padding:0; height:260px; position:relative; overflow:hidden;">
  <img src="../assets/hero-experimental.png" alt="Experimental hero" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
  <div style="position:absolute; left:0; top:0; padding:20px; display:flex; gap:10px; align-items:center;">
    <div style="width:56px; height:56px; background:#AEFE00; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:22px; color:#0A0B08; letter-spacing:-.02em;">LLAB</div>
    <div style="font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.08em; color:#0A0B08;">EXPERIMENTAL · HERO TREATMENT</div>
  </div>
  <div style="position:absolute; left:24px; bottom:24px;">
    <div style="font-family:var(--font-display); font-weight:700; font-size:48px; line-height:1; letter-spacing:-.02em; color:#0A0B08;">Experimental</div>
  </div>
</div>
</body></html>

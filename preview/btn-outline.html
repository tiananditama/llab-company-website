<!doctype html>
<html><head><meta charset="utf-8"><title>Button · Outline pill</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card" style="background:linear-gradient(90deg,#191919 50%, #797979 50%);">
  <div class="tag" style="margin-bottom:18px;">Outline · sits over imagery or split fields · 70% ink + blur</div>
  <div style="display:flex; gap:18px; align-items:center; flex-wrap:wrap;">
    <button class="llab-btn llab-btn--outline">Brave</button>
    <button class="llab-btn llab-btn--outline" style="background:#AEFE00; color:#0A0B08; border-color:transparent;">Hover</button>
    <button class="llab-btn llab-btn--outline" style="transform:translateY(1px);">Pressed</button>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:18px;">Almost no icons. The flip toggle is the only one shipping.</div>
  <div style="display:flex; gap:36px; align-items:center;">
    <div style="text-align:center;">
      <div style="width:96px; height:96px; background:#1A1B16; display:flex; align-items:center; justify-content:center;">
        <img src="../assets/icon-flip-light.svg" alt="flip" style="width:36px; height:36px; filter:invert(94%) sepia(8%) saturate(83%) hue-rotate(13deg) brightness(102%);">
      </div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:10px; letter-spacing:0.06em; color:#F4F4EF; margin-top:10px;">FLIP · LIGHT</div>
    </div>
    <div style="text-align:center;">
      <div style="width:96px; height:96px; background:#F4F5EF; display:flex; align-items:center; justify-content:center;">
        <img src="../assets/icon-flip-dark.svg" alt="flip" style="width:36px; height:36px;">
      </div>
      <div style="font-family:var(--font-mono); font-weight:700; font-size:10px; letter-spacing:0.06em; color:#F4F4EF; margin-top:10px;">FLIP · DARK</div>
    </div>
    <div style="flex:1; font-family:var(--font-ui); font-weight:400; font-size:14px; color:#F4F4EF; opacity:.75; line-height:1.5;">
      Source: <span style="font-family:var(--font-mono); font-weight:700; font-size:12px;">material-symbols:flip</span><br>
      For new glyphs, link Material Symbols Outlined from CDN. <br>
      <strong style="color:#AEFE00;">No emoji. No Unicode-as-icon.</strong>
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Mark-on-block</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card" style="background:linear-gradient(135deg,#0A0B08 50%, #797979 50%); padding:40px 32px; display:flex; align-items:center; justify-content:center; min-height:240px;">
  <div style="font-family:var(--font-display); font-weight:700; line-height:1; letter-spacing:-0.02em; color:#FFFFFF; text-align:center;">

  </div>
</div>

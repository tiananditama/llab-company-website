<!doctype html>
<html><head><meta charset="utf-8"><title>Brand color</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:20px; align-items:stretch;">
    <div style="flex:1.4; aspect-ratio:1.6; background:#AEFE00; display:flex; align-items:flex-end; padding:14px 16px; color:#0A0B08; font-family:var(--font-mono); font-weight:700; font-size:12px; letter-spacing:0.06em;">LLAB&nbsp;GREEN<br><span style="opacity:.7">#AEFE00</span></div>
    <div style="flex:1; aspect-ratio:1.2; background:#D7FF2E; display:flex; align-items:flex-end; padding:12px; color:#0A0B08; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">BRIGHT<br><span style="opacity:.7">#D7FF2E</span></div>
    <div style="flex:1; aspect-ratio:1.2; background:#2A8F2F; display:flex; align-items:flex-end; padding:12px; color:#F4F4EF; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">DEEP<br><span style="opacity:.7">#2A8F2F</span></div>
    <div style="flex:1; aspect-ratio:1.2; background:#0E3D14; display:flex; align-items:flex-end; padding:12px; color:#F4F4EF; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">DARK<br><span style="opacity:.7">#0E3D14</span></div>
  </div>
</div>
</body></html>

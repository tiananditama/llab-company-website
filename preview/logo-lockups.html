<!doctype html>
<html><head><meta charset="utf-8"><title>Logo lockups</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card" style="padding:24px;">
  <div style="display:flex; gap:14px; align-items:stretch;">
    <div style="flex:1; aspect-ratio:1; background:#AEFE00; display:flex; align-items:center; justify-content:center;">
      <img src="../assets/llab-logo-green.png" alt="LLAB" style="width:78%; height:auto;">
    </div>
    <div style="flex:1; aspect-ratio:1; background:#0A0B08; display:flex; align-items:center; justify-content:center; padding:18px;">
      <img src="../assets/llab-sign-white.png" alt="LLAB white" style="width:78%; height:auto;">
    </div>
    <div style="flex:1; aspect-ratio:1; background:#F4F5EF; display:flex; align-items:center; justify-content:center; padding:18px;">
      <img src="../assets/llab-sign-white.png" alt="LLAB black" style="width:78%; height:auto; filter:invert(1);">
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:16px;">4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128</div>
  <div style="display:flex; align-items:flex-end; gap:6px;">
    <div style="width:4px;  height:24px; background:#AEFE00;"></div>
    <div style="width:8px;  height:32px; background:#AEFE00;"></div>
    <div style="width:12px; height:42px; background:#AEFE00;"></div>
    <div style="width:16px; height:54px; background:#AEFE00;"></div>
    <div style="width:24px; height:66px; background:#AEFE00;"></div>
    <div style="width:32px; height:78px; background:#AEFE00;"></div>
    <div style="width:48px; height:90px; background:#AEFE00;"></div>
    <div style="width:64px; height:104px; background:#AEFE00;"></div>
    <div style="width:96px; height:118px; background:#AEFE00;"></div>
    <div style="width:128px; height:132px; background:#AEFE00;"></div>
  </div>
  <div style="display:flex; gap:6px; margin-top:8px; font-family:var(--font-mono); font-weight:700; font-size:10px; letter-spacing:0.05em; color:#F4F4EF; opacity:.7;">
    <span style="width:4px;">4</span><span style="width:8px;">8</span><span style="width:12px;">12</span><span style="width:16px;">16</span><span style="width:24px;">24</span><span style="width:32px;">32</span><span style="width:48px;">48</span><span style="width:64px;">64</span><span style="width:96px;">96</span><span style="width:128px;">128</span>
  </div>
</div>
</body></html>

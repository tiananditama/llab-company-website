<!doctype html>
<html><head><meta charset="utf-8"><title>Button · Green pill</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:18px;">Primary action · dark gray at rest · green on hover</div>
  <div style="display:flex; gap:18px; align-items:center; flex-wrap:wrap;">
    <button class="llab-btn" style="background:#1A1B16; color:#F4F4EF;">Brave</button>
    <button class="llab-btn" style="background:#AEFE00; color:#0A0B08;">Hover</button>
    <button class="llab-btn" style="background:#AEFE00; color:#0A0B08; transform:translateY(1px);">Pressed</button>
  </div>
</div>
</body></html>

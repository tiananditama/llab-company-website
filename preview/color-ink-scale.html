<!doctype html>
<html><head><meta charset="utf-8"><title>Ink scale</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:0; align-items:stretch;">
    <div style="flex:1; aspect-ratio:1; background:#050604; display:flex; align-items:flex-end; padding:12px; color:#F4F4EF; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">INK&nbsp;1<br><span style="opacity:.6">#050604</span></div>
    <div style="flex:1; aspect-ratio:1; background:#0A0B08; display:flex; align-items:flex-end; padding:12px; color:#F4F4EF; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">INK&nbsp;2<br><span style="opacity:.6">#0A0B08</span></div>
    <div style="flex:1; aspect-ratio:1; background:#0B0C09; display:flex; align-items:flex-end; padding:12px; color:#F4F4EF; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">INK&nbsp;3<br><span style="opacity:.6">#0B0C09</span></div>
    <div style="flex:1; aspect-ratio:1; background:#1A1B16; display:flex; align-items:flex-end; padding:12px; color:#F4F4EF; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">INK&nbsp;4<br><span style="opacity:.6">#1A1B16</span></div>
    <div style="flex:1; aspect-ratio:1; background:#191919; display:flex; align-items:flex-end; padding:12px; color:#F4F4EF; font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.06em;">INK&nbsp;5<br><span style="opacity:.6">#191919</span></div>
  </div>
</div>
</body></html>

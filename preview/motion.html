<!doctype html>
<html><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="card.css"></head>
<body>
<div class="card">
  <div class="tag" style="margin-bottom:14px;">Motion · ease-out (entry), ease-snap (toggles)</div>
  <div style="font-family:var(--font-ui); font-weight:700; font-size:18px; color:#F4F4EF; line-height:1.4;">
    140 · 220 · 420ms<br>
    <span style="font-family:var(--font-mono); font-weight:700; font-size:12px; letter-spacing:0.06em; opacity:.65;">CUBIC-BEZIER(0.22, 1, 0.36, 1)</span>
  </div>
  <div style="height:18px;"></div>
  <div style="position:relative; height:14px; background:rgba(255,255,255,0.06); border-radius:0;">
    <div style="position:absolute; left:0; top:0; height:100%; width:60%; background:#AEFE00;"></div>
  </div>
  <div style="display:flex; justify-content:space-between; margin-top:6px; font-family:var(--font-mono); font-weight:700; font-size:10px; letter-spacing:0.05em; color:#F4F4EF; opacity:.6;">
    <span>FAST · 140</span><span>BASE · 220</span><span>SLOW · 420</span>
  </div>
  <div style="margin-top:18px; font-family:var(--font-ui); font-weight:400; font-size:14px; color:#F4F4EF; opacity:.7; line-height:1.45;">
    No bounces. No springs. Press = translateY(1px). Hover = single property change.
  </div>
</div>
</body></html>
